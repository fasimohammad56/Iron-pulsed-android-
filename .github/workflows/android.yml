
name: Build IronPulse APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project
        run: |
          unzip -o IronPulseAndroid_Project.zip -d extracted
          test -f extracted/IronPulseAndroid/app/build.gradle.kts

      - name: Configure Java and Kotlin targets
        working-directory: extracted/IronPulseAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          marker = "    buildFeatures { compose = true }"

          config = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

          '''

          if "jvmTarget = \"17\"" not in s:
              if marker not in s:
                  raise SystemExit("Could not find buildFeatures in app/build.gradle.kts")
              s = s.replace(marker, config + marker, 1)
              p.write_text(s)
          PY

      - name: Build APK
        working-directory: extracted/IronPulseAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IronPulse-debug-apk
          path: extracted/IronPulseAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
